[project]
name = "lightweight-wake-word-detection"
version = "0.1.0"
description = "Lightweight on-device wake-word detection for the Vietnamese wake phrase 'Alo GPT à em'"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["data", "data_synth", "runs", "runs_smoke"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402", "B008", "B023", "E731", "B905", "E741"]
